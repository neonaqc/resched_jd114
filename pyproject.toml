[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neonaqc-resched_jd114"
version = "0.1.0"
description = "把候选项映射到类别上，算出训练资源调度工程师·长上下文的位置编码外推的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "neonaqc" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://neonaqc.github.io"
Repository = "https://github.com/neonaqc/resched_jd114"
Issues = "https://github.com/neonaqc/resched_jd114/issues"

[project.scripts]
resched_jd114 = "resched_jd114:main"

[tool.setuptools]
py-modules = ["resched_jd114"]
